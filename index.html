<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研习魔典 · Grimoire</title>
<meta name="theme-color" content="#f4ead2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="研习魔典">
<style>
  :root{
    --parchment:#f4ead2;
    --parchment-2:#ecdfc0;
    --card:#fbf4e2;
    --ink:#2a3a2f;
    --ink-soft:#5c6d5f;
    --gold:#b8860b;
    --gold-light:#d4af37;
    --wine:#7b2d2d;
    --line:#c9b88a;
    --shadow:rgba(42,58,47,.16);
    --common:#8a8a6f;
    --rare:#3f6f5f;
    --epic:#6b4a8a;
    --legend:#b8860b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Georgia,'Palatino Linotype','Songti SC','STSong','Kaiti SC',serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(212,175,55,.12), transparent 60%),
      radial-gradient(900px 700px at 100% 100%, rgba(123,45,45,.07), transparent 55%),
      var(--parchment);
    background-attachment:fixed;
    min-height:100vh;
    padding:28px 18px 60px;
  }
  .app{max-width:1060px;margin:0 auto;}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:20px;
    padding:20px 26px;margin-bottom:18px;
    background:linear-gradient(160deg,var(--card),var(--parchment-2));
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 6px 22px var(--shadow);
    position:relative;overflow:hidden;
  }
  header::after{
    content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    background:radial-gradient(circle,rgba(212,175,55,.18),transparent 70%);
    border-radius:50%;
  }
  .title-wrap{flex:1;}
  h1{margin:0;font-size:30px;letter-spacing:2px;font-weight:600;}
  h1 .sigil{color:var(--gold);}
  .subtitle{margin:4px 0 0;color:var(--ink-soft);font-size:13px;letter-spacing:1px;}
  .name-line{margin-top:8px;font-size:13px;color:var(--ink-soft);}
  .name-line b{color:var(--gold);cursor:pointer;}
  .seal{
    flex:0 0 auto;width:74px;height:74px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fdf6e3;background:radial-gradient(circle at 35% 30%,#d4af37,#8a5a00 70%);
    border:3px solid #6d4600;box-shadow:0 4px 14px var(--shadow), inset 0 0 0 3px rgba(255,255,255,.12);
    font-weight:bold;
  }
  .seal .lv{font-size:12px;letter-spacing:1px;opacity:.85;}
  .seal .num{font-size:26px;line-height:1;}
  .xp-outer{
    margin-top:10px;height:9px;background:#e3d6b4;border:1px solid var(--line);
    border-radius:6px;overflow:hidden;
  }
  .xp-inner{
    height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));
    transition:width .6s ease;border-radius:6px;
  }
  .xp-label{font-size:11px;color:var(--ink-soft);margin-top:4px;letter-spacing:.5px;}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media (max-width:880px){main{grid-template-columns:1fr;}}
  .col{display:flex;flex-direction:column;gap:18px;}

  .panel{
    background:linear-gradient(160deg,var(--card),#f7efdd);
    border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;box-shadow:0 4px 16px var(--shadow);
  }
  .panel h2{
    margin:0 0 14px;font-size:17px;letter-spacing:1px;
    display:flex;align-items:center;gap:8px;color:var(--ink);
  }
  .panel h2::before{content:"✦";color:var(--gold);}
  .hint{font-size:11px;color:var(--ink-soft);font-weight:normal;letter-spacing:0;margin-left:auto;}

  /* ---------- stats ---------- */
  .stat-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative;}
  .stat-icon{width:26px;text-align:center;font-size:17px;}
  .stat-label{flex:0 0 54px;font-size:14px;letter-spacing:1px;}
  .stat-bar-wrap{flex:1;height:15px;background:#e6dabd;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .stat-bar{height:100%;border-radius:8px;transition:width .6s ease;position:relative;}
  .stat-num{flex:0 0 34px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-soft);}
  .bar-int{background:linear-gradient(90deg,#2f6f4f,#4fae7f);}
  .bar-str{background:linear-gradient(90deg,#8a5a2b,#c98a3a);}
  .bar-cha{background:linear-gradient(90deg,#3f5f8a,#6f8fcf);}
  .bar-will{background:linear-gradient(90deg,#6b4a8a,#a06fd0);}
  .bar-hp{background:linear-gradient(90deg,#7b2d2d,#c94f4f);}
  .bar-hp.good{background:linear-gradient(90deg,#2f6f4f,#4fae7f);}
  .bar-hp.mid{background:linear-gradient(90deg,#b8860b,#d4af37);}
  .bar-hp.low{background:linear-gradient(90deg,#7b2d2d,#c94f4f);}
  .flash{animation:flash .9s ease;}
  @keyframes flash{0%{filter:brightness(1.9);}100%{filter:brightness(1);}}

  .rest-row{display:flex;align-items:center;gap:10px;margin-top:6px;padding-top:12px;border-top:1px dashed var(--line);}
  button{
    font-family:inherit;cursor:pointer;border-radius:8px;
    border:1px solid var(--line);background:linear-gradient(160deg,#fffaf0,#f0e6cd);
    color:var(--ink);padding:7px 12px;font-size:13px;letter-spacing:.5px;
    transition:transform .08s ease, box-shadow .12s ease;
  }
  button:hover{box-shadow:0 2px 8px var(--shadow);}
  button:active{transform:translateY(1px);}
  button.primary{background:linear-gradient(160deg,#e8d29a,#d4af37);border-color:#a9861f;color:#3a2c05;font-weight:bold;}
  button.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:2px 6px;}
  button.ghost:hover{color:var(--wine);}
  .rest-note{font-size:11px;color:var(--ink-soft);margin-left:auto;}

  /* ---------- tasks ---------- */
  .task{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed #e3d6b4;}
  .task:last-of-type{border-bottom:none;}
  .task input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;flex:0 0 auto;}
  .task .name{flex:1;font-size:14px;}
  .task.done .name{text-decoration:line-through;color:#a89b7c;}
  .task-stat{font-size:11px;color:var(--ink-soft);flex:0 0 auto;white-space:nowrap;}
  .task .del{color:#b09b72;flex:0 0 auto;}
  .add-row{display:flex;gap:8px;margin-top:12px;}
  .add-row input[type=text]{flex:1;font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fffdf5;color:var(--ink);}
  .add-row select{font-family:inherit;font-size:13px;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fffdf5;color:var(--ink);}
  .repeat-label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft);white-space:nowrap;cursor:pointer;}
  .repeat-label input{accent-color:var(--gold);}
  .repeat-badge{flex:0 0 auto;font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:9px;padding:0 5px;margin-left:4px;}
  .hist-summary{font-size:12px;color:var(--ink-soft);margin:2px 0 8px;}
  .heatmap{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;}
  .hm-week{display:flex;flex-direction:column;gap:3px;}
  .hm-cell{width:12px;height:12px;border-radius:3px;display:block;flex:0 0 auto;}
  .hm-empty{background:transparent;border:1px dashed #d9ccb0;}
  .hm-lv0{background:#ece1c2;}
  .hm-lv1{background:#e6d29b;}
  .hm-lv2{background:#d8bb66;}
  .hm-lv3{background:#c49f3c;}
  .hm-lv4{background:#a67c22;}
  .hist-legend{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-soft);margin-top:6px;}
  .hist-legend .hm-cell{width:10px;height:10px;}
  .hist-list{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;max-height:200px;overflow-y:auto;}
  .hist-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;}
  .hist-date{flex:0 0 auto;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .hist-name{flex:1;color:var(--ink);}
  .hist-stat{flex:0 0 auto;color:var(--gold);font-size:11px;}
  .backfill{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .backfill input[type=text]{flex:1;min-width:130px;font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fffdf5;color:var(--ink);}
  .backfill input[type=date]{font-family:inherit;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fffdf5;color:var(--ink);}
  .backfill select{font-family:inherit;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fffdf5;color:var(--ink);}
  .life-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;flex-wrap:wrap;}
  .life-row + .life-row{border-top:1px dashed var(--line);}
  .life-label{flex:0 0 auto;color:var(--ink);font-weight:600;}
  .life-val{flex:1;color:var(--ink-soft);}
  .life-hint{font-size:11px;color:var(--ink-soft);margin:-2px 0 6px;}
  .mood-row{display:flex;gap:4px;}
  .mood-btn{font-size:17px;line-height:1;padding:3px 7px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;opacity:.45;}
  .mood-btn.on{opacity:1;border-color:var(--gold);background:#fff6dd;}
  .en-btn{font-size:12px;line-height:1;padding:3px 9px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;opacity:.45;font-variant-numeric:tabular-nums;}
  .en-btn.on{opacity:1;border-color:var(--gold);background:#fff6dd;}
  .mood-strip{font-size:15px;letter-spacing:2px;}

  /* ---------- quests ---------- */
  .quest{background:#fffaf0;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
  .quest-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .quest-name{flex:1;font-size:14px;font-weight:bold;letter-spacing:.5px;}
  .countdown{font-size:12px;flex:0 0 auto;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .cd-far{background:#e3f0e3;color:#2f6f4f;}
  .cd-near{background:#f5ead0;color:#9a7410;}
  .cd-over{background:#f3dede;color:#7b2d2d;}
  .quest-step{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;color:var(--ink-soft);}
  .quest-step input{accent-color:var(--gold);cursor:pointer;}
  .quest-step.done label{text-decoration:line-through;color:#a89b7c;}
  .quest-step label{flex:1;cursor:pointer;}
  .quest-edit{font-size:10px;color:#b09b72;cursor:pointer;border-bottom:1px dotted #c9b88a;}
  .quest-progress{height:5px;background:#e6dabd;border-radius:3px;overflow:hidden;margin-top:8px;}
  .quest-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width .4s ease;}

  /* ---------- grimoire cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:13px;}
  .card{
    border-radius:14px;padding:11px 10px 11px;text-align:center;min-height:158px;
    background:#fffaf0;border:1px solid var(--line);position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--line);}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 22px var(--shadow);}
  .card .medal{
    width:54px;height:54px;border-radius:50%;margin-top:7px;
    display:flex;align-items:center;justify-content:center;
    font-size:27px;line-height:1;flex:0 0 auto;
    background:radial-gradient(circle at 34% 30%, #fffdf6, #efe3c6);
    border:2px solid var(--line);
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.06), 0 3px 9px rgba(0,0,0,.09);
  }
  .card .cname{font-size:13px;font-weight:bold;letter-spacing:1px;margin-top:1px;}
  .card .rarity{
    font-size:9px;letter-spacing:3px;padding:1px 8px;border-radius:9px;
    border:1px solid currentColor;line-height:1.5;
  }
  .card .ctext{font-size:10px;color:var(--ink-soft);line-height:1.4;max-width:92%;}
  .card .prog{font-size:9px;color:var(--ink-soft);opacity:.85;letter-spacing:.4px;}

  .card.locked{filter:grayscale(.85);opacity:.72;border-style:dashed;}
  .card.locked .medal{background:radial-gradient(circle at 34% 30%, #f3efe3, #e4dbc4);}
  .card.locked .cname{color:#a89b7c;}

  .rarity-common::before{background:var(--common);}
  .rarity-rare::before{background:var(--rare);}
  .rarity-epic::before{background:var(--epic);}
  .rarity-legend::before{background:linear-gradient(90deg,var(--gold-light),var(--legend),var(--gold-light));}

  .rarity-common .medal{border-color:var(--common);color:var(--common);}
  .rarity-common .rarity{color:var(--common);}
  .rarity-rare .medal{border-color:var(--rare);color:var(--rare);}
  .rarity-rare .rarity{color:var(--rare);}
  .rarity-epic .medal{border-color:var(--epic);color:var(--epic);}
  .rarity-epic .rarity{color:var(--epic);}
  .rarity-legend .medal{border-color:var(--legend);color:var(--legend);box-shadow:inset 0 -2px 4px rgba(0,0,0,.06), 0 0 14px rgba(184,134,11,.45);}
  .rarity-legend .rarity{color:var(--legend);}
  .card .medal svg{width:38px;height:38px;display:block;overflow:visible;}
  .card .medal .qmark{font-size:26px;line-height:1;}
  /* 彩色插画卡片（试做） */
  .card.illus{padding:8px 8px 11px;gap:4px;justify-content:flex-start;}
  .card.illus .art{width:100%;height:104px;border-radius:9px;overflow:hidden;background:#e8dcc0;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .card.illus .art svg{width:100%;height:100%;display:block;}
  .card.illus .art .qmark{font-size:34px;color:#a89b7c;}
  .card.illus.locked .art{filter:grayscale(1);opacity:.75;}

  /* 已解锁：染上稀有度底色 + 微光；传说额外镀金 */
  .rarity-common:not(.locked){background:linear-gradient(165deg,#fbf7ec,#f2edda);}
  .rarity-rare:not(.locked){background:linear-gradient(165deg,#f5faf6,#e6f0e9);}
  .rarity-epic:not(.locked){background:linear-gradient(165deg,#f8f4fb,#ede4f3);}
  .rarity-legend:not(.locked){background:linear-gradient(165deg,#fdf6e0,#f7e7b8);box-shadow:0 0 0 1px var(--legend) inset, 0 4px 16px rgba(184,134,11,.18);}
  .collect-count{font-size:11px;color:var(--ink-soft);margin-bottom:10px;letter-spacing:.5px;}

  /* ---------- footer / data ---------- */
  footer{
    margin-top:18px;display:flex;gap:10px;align-items:center;justify-content:center;
    font-size:11px;color:var(--ink-soft);flex-wrap:wrap;
  }
  .ver{
    padding:2px 7px;border:1px solid var(--line);border-radius:10px;
    color:var(--ink-soft);font-size:10px;letter-spacing:.5px;
  }

  /* ---------- toast & modal ---------- */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fdf6e3;padding:11px 20px;border-radius:24px;
    font-size:14px;letter-spacing:.5px;box-shadow:0 8px 26px rgba(0,0,0,.3);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #modal{
    position:fixed;inset:0;background:rgba(42,58,47,.55);display:none;
    align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  #modal.show{display:flex;}
  .modal-box{
    background:linear-gradient(160deg,#fffaf0,#f0e6cd);border:2px solid var(--gold);
    border-radius:16px;padding:26px 30px;max-width:460px;width:100%;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);
    animation:pop .3s ease;
  }
  @keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-box h3{margin:0 0 6px;letter-spacing:2px;}
  .modal-box .reveal{font-size:13px;color:var(--ink-soft);margin-bottom:16px;}
  .reveal-card{display:flex;align-items:center;gap:14px;text-align:left;margin:10px 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fffdf5;}
  .reveal-card .emoji{font-size:30px;}
  .reveal-card .rname{font-weight:bold;letter-spacing:1px;}
  .reveal-card .rrarity{font-size:10px;letter-spacing:2px;}
  .reveal-card .rtext{font-size:11px;color:var(--ink-soft);}

  /* ---------- 手机端 ---------- */
  @media (max-width:560px){
    body{padding:14px 10px 56px;}
    header{padding:14px 16px;gap:12px;}
    h1{font-size:22px;letter-spacing:1px;}
    .seal{width:56px;height:56px;}
    .seal .num{font-size:20px;}
    .panel{padding:14px 14px;}
    .add-row{flex-wrap:wrap;}
    .add-row input[type=text]{flex:1 1 100%;}
    .add-row select{flex:1 1 42%;}
    button{padding:9px 12px;min-height:38px;}
    .task{padding:9px 2px;gap:8px;}
    .task .name{font-size:13px;}
    .stat-label{flex-basis:48px;font-size:13px;}
    .modal-box{padding:22px 18px;}
    .backfill input[type=text]{min-width:100%;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-wrap">
      <h1><span class="sigil">✦</span> 研习魔典 <span class="sigil">✦</span></h1>
      <p class="subtitle">把每一天的努力，酿成魔法</p>
      <p class="name-line">学徒：<b id="charName">——</b></p>
    </div>
    <div class="seal" title="等级">
      <span class="lv">Lv.</span>
      <span class="num" id="sealLv">1</span>
    </div>
  </header>

  <div class="xp-outer"><div class="xp-inner" id="xpBar" style="width:0%"></div></div>
  <div class="xp-label" id="xpLabel">经验 0 / 100</div>

  <main>
    <div class="col">
      <section class="panel">
        <h2>属性卷轴 <span class="hint">完成日课以提升</span></h2>
        <div id="stats"></div>
        <div class="rest-row">
          <button class="primary" id="restBtn">🛌 小憩回血</button>
          <span class="rest-note" id="restNote">今日剩余 2 次</span>
        </div>
      </section>

      <section class="panel">
        <h2>今日日课 <span class="hint" id="dayLabel">勾选即得属性与经验</span></h2>
        <div id="tasks"></div>
        <div class="add-row">
          <input type="text" id="newTask" placeholder="添加一件今天要做的事…" maxlength="40">
          <select id="newStat">
            <option value="int">智力</option>
            <option value="str">体力</option>
            <option value="cha">魅力</option>
            <option value="will">意志</option>
          </select>
          <select id="newRepeat">
            <option value="once">一次性</option>
            <option value="daily">每日</option>
            <option value="weekly">每周</option>
          </select>
          <select id="newWeight" title="这件要花多少功夫：普通 +5，重的加更多">
            <option value="1">+5</option>
            <option value="2">+10</option>
            <option value="3">+15</option>
          </select>
          <button id="addTask">＋</button>
        </div>
      </section>

      <section class="panel">
        <h2>🌿 生活 <span class="hint">照顾好自己</span></h2>
        <div id="life"></div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <h2>主线任务 <span class="hint">点击日期可修改</span></h2>
        <div id="quests"></div>
      </section>

      <section class="panel">
        <h2>图鉴 <span class="hint">做到即解锁</span></h2>
        <div class="collect-count" id="collectCount"></div>
        <div class="cards" id="cards"></div>
      </section>

      <section class="panel">
        <h2>🗓️ 足迹 <span class="hint">过去做了什么</span></h2>
        <div class="hist-summary" id="histSummary"></div>
        <div class="heatmap" id="heatmap"></div>

      try{
        var old=JSON.parse(raw);
        var prog={};
        for(var k in old){ if(k!=="tasks") prog[k]=old[k]; }
        localStorage.setItem(PROGRESS_KEY, JSON.stringify(prog));
        localStorage.setItem(TASKS_KEY, JSON.stringify(old.tasks||defaultTasks()));
        localStorage.removeItem("grimoire_v"+i);
        return;
      }catch(e){}
    }
  }

    state = defaultProgress();
    if(p){ for(var k in p){ state[k]=p[k]; } }

  function clamp(n,lo,hi){return Math.max(lo,Math.min(hi,n));}

  // 一天从凌晨 2 点开始（熬夜的话 1 点还算「今天」）
  function dayKey(){
    var d=new Date(Date.now()-2*3600*1000);
    function p(n){return (n<10?"0":"")+n;}
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  function dayLabel(){
    var k=dayKey().split("-");
    return parseInt(k[1],10)+"月"+parseInt(k[2],10)+"日";
  }
  // 只有真正的「每日习惯」（锻炼 / 读论文）才会每天自动刷新；其它任务一律一次性，不再自动 renew
  function isHabitName(name){
    if(!name) return false;
    if(/锻炼/.test(name)) return true;
    if(/篇/.test(name) && /论文|文献/.test(name)) return true;   // 读/看 X 篇论文/文献
    if(/读论文|看论文|读文献|看文献/.test(name)) return true;    // 直接写「读论文」「看论文」这类
    return false;
  }
  function normalizeHabits(){
    state.tasks.forEach(function(t){
      if(isHabitName(t.name)){ t.habit=true; if(!t.repeat) t.repeat="daily"; }
      else if(t.repeat==="daily"){ t.repeat=false; delete t.habit; }
    });
  }
  function checkDayRollover(){
    var k=dayKey();
    if(!state.dayKey){ state.dayKey=k; return; } // 首次加载，只初始化
    if(state.dayKey===k) return;
    state.tasks.forEach(function(t){
      if(t.habit===true){ t.done=false; }
      else if(t.repeat==="weekly" && t.done && t.weekDone!==weekKey()){ t.done=false; }
    });
    // 完成的一次性日课，第二天自动从列表清掉（足迹/分数已存在 history，不受影响）
    state.tasks = state.tasks.filter(function(t){
      if(t.done !== true) return true;          // 未完成留着
      if(t.habit === true) return true;          // 每日习惯留着（上面已重置）
      if(t.repeat === "weekly") return true;     // 每周任务留着
      return false;                               // 完成的一次性任务删掉
    });
    state.restDate=k; state.restUsed=0;
    state.dayKey=k;
    persist(); render();
    toast("🌅 新的一天，每日日课已刷新");
  }

  // ---------- 足迹 / 历史记录 ----------
  function weekdayOfKey(key){
    var p=key.split("-");
    var d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10), 12,0,0);
    return (d.getDay()+6)%7; // 周一=0 .. 周日=6
  }
  function dayKeyOffset(n){
    var d=new Date(Date.now()-2*3600*1000 - n*86400000);
    function p(x){return (x<10?"0":"")+x;}
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  function heatLevel(n){
    if(!n) return "hm-lv0";
    if(n===1) return "hm-lv1";
    if(n===2) return "hm-lv2";
    if(n<=4) return "hm-lv3";
    return "hm-lv4";
  }
  function fmtDay(key){
    var p=key.split("-");
    return parseInt(p[1],10)+"/"+parseInt(p[2],10);
  }
  function renderHistory(){
    var hist=state.history||[];
    var countMap={};
    hist.forEach(function(h){ countMap[h.d]=(countMap[h.d]||0)+1; });

    var weekTotal=0;
    for(var i=0;i<7;i++){ weekTotal+=(countMap[dayKeyOffset(i)]||0); }
    document.getElementById("histSummary").textContent="累计完成 "+state.totalDone+" 次日课 · 近 7 天 "+weekTotal+" 次";

    var weeks=12, todayWd=weekdayOfKey(dayKey());
    var html="";
    for(var w=0;w<weeks;w++){
      html+='<div class="hm-week">';
      for(var d=0;d<7;d++){
        var offset=(weeks-1-w)*7 + (todayWd-d);
        if(offset<0){ html+='<i class="hm-cell hm-empty"></i>'; continue; }
        var key=dayKeyOffset(offset);
        var c=countMap[key]||0;
        html+='<i class="hm-cell '+heatLevel(c)+'" title="'+fmtDay(key)+'：完成 '+c+' 次"></i>';
      }
      html+='</div>';
    }
    document.getElementById("heatmap").innerHTML=html;

    var list=document.getElementById("histList");
    if(hist.length===0){
      list.innerHTML='<div class="hint">还没有完成记录，去勾一个日课试试吧。</div>';
      return;
    }
    var recent=hist.slice(-15).reverse();
    var items=recent.map(function(h){
      return '<div class="hist-item"><span class="hist-date">'+fmtDay(h.d)+'</span>'
        +'<span class="hist-name">'+esc(h.n)+'</span>'

  // ---------- 生活：经期 / 出门 / 状态 ----------
  function daysBetween(a,b){
    var pa=a.split("-"), pb=b.split("-");
    var da=new Date(pa[0],pa[1]-1,pa[2]);
    var db=new Date(pb[0],pb[1]-1,pb[2]);
    return Math.round((db-da)/86400000);
  }
  function addDaysKey(key,n){
    var p=key.split("-");
    var d=new Date(p[0],p[1]-1,p[2]+n);
    function z(x){return (x<10?"0":"")+x;}
    return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
  }
  function weekKey(){
    var wd=weekdayOfKey(dayKey());
    return dayKeyOffset(wd);
  }
  function exercisePaused(){
    if(!state.periodStart) return false;
    var n=daysBetween(state.periodStart, dayKey());
    return n>=0 && n<NO_EXERCISE_DAYS;
  }
  function periodInfo(){
    if(!state.periodStart) return null;
    var n=daysBetween(state.periodStart, dayKey());
    if(n<0) return {before:true};
    if(n>=PERIOD_DAYS) return {after:true, next:addDaysKey(state.periodStart, CYCLE_DAYS)};
    return {day:n+1, total:PERIOD_DAYS, pauseLeft:Math.max(0, NO_EXERCISE_DAYS-(n+1)), next:addDaysKey(state.periodStart, CYCLE_DAYS)};
  }
  function outStreak(){
    var set={};
    (state.outDays||[]).forEach(function(d){ set[d]=1; });
    var n = set[dayKey()] ? 0 : 1;
    var streak=0;
    while(set[dayKeyOffset(n)]){ streak++; n++; }
    return streak;
  }

  // ---------- 音效（Web Audio，无需外部文件） ----------
  var audioCtx=null;
  function ensureAudio(){
    if(!audioCtx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(AC) audioCtx=new AC();
    }
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  }
  function tone(freq,delay,dur,type,vol){
    if(!audioCtx) return;
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    var t=audioCtx.currentTime+(delay||0);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol||0.1,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+dur+0.05);
  }
  function sndDing(){ensureAudio();tone(880,0,0.22,"sine",0.10);tone(1320,0.06,0.32,"sine",0.07);}
  function sndLevelUp(){ensureAudio();tone(523,0,0.28,"sine",0.11);tone(659,0.10,0.28,"sine",0.11);tone(784,0.20,0.4,"sine",0.11);}
  function sndUnlock(){ensureAudio();tone(1046,0,0.18,"triangle",0.08);tone(1568,0.08,0.3,"triangle",0.06);}

  // ---------- 逻辑 ----------
  function taskWeight(t){ return (t.w && t.w>0) ? t.w : 1; }
  function applyTask(t,sign){
    // sign: +1 完成, -1 撤销；奖励按「份量」w 放大（普通 1，重活加更多）
    var w=taskWeight(t);
    state.stats[t.stat] = clamp(state.stats[t.stat] + sign*STAT_GAIN*w, 0, 999);
    state.xp = clamp(state.xp + sign*XP_GAIN*w, 0, 99999);
    state.hp = clamp(state.hp - sign*HP_COST, 0, 100);
    state.hpMin = Math.min(state.hpMin, state.hp);
    state.totalDone = clamp(state.totalDone + sign, 0, 999999);
  }

  function afterChange(feedback){
    // 等级提升
    var lv=levelOf(state);
    if(lv>state.lastLevel){ state.lastLevel=lv; sndLevelUp(); toast("🎉 等级提升！Lv."+lv); }
    // 图鉴解锁
    var newly=[];
    CARDS.forEach(function(c){
      if(state.unlocked.indexOf(c.id)<0 && c.cond(state)) newly.push(c);
    });
    if(newly.length){
      newly.forEach(function(c){state.unlocked.push(c.id);});
      showReveal(newly);
    }
    if(feedback){ toast(feedback); }
    save(); render();
  }

  function toggleTask(id){
    var t=state.tasks.find(function(x){return x.id===id;}); if(!t)return;
    if(!t.done){
      t.done=true; applyTask(t,1);
      if(t.repeat==="weekly") t.weekDone=weekKey();
      (state.history=state.history||[]).push({d:dayKey(),n:t.name,s:t.stat});
      sndDing();
      var w=taskWeight(t);
      afterChange("✨ 完成「"+t.name+"」：+"+STAT_GAIN*w+" "+statLabel(t.stat)+" · +"+XP_GAIN*w+" 经验 · -"+HP_COST+" 血");
      flashStat(t.stat); flashStat("hp");
    }else{
      t.done=false; applyTask(t,-1);
      var h=state.history||[];
      for(var i=h.length-1;i>=0;i--){
        if(h[i].n===t.name && h[i].d===dayKey()){ h.splice(i,1); break; }
      }
      afterChange("↩ 撤销「"+t.name+"」");

  }

  // ---------- 云端同步 ----------
  function syncToken(){ return localStorage.getItem(SYNC_TOKEN_KEY)||""; }
  function syncEnabled(){ return !!syncToken(); }
  function syncAuthHeader(){
    var t=syncToken();
    return (t.indexOf("github_pat_")===0 ? "Bearer " : "token ") + t;
  }
  function apiUrl(){
    return "https://api.github.com/repos/"+SYNC_OWNER+"/"+SYNC_REPO+"/contents/"+SYNC_FILE;
  }
  function getHeaders(){
    return { "Authorization":syncAuthHeader(), "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", "Content-Type":"application/json" };
  }
  function b64Encode(s){
    var b=new TextEncoder().encode(s), bin="";
    for(var i=0;i<b.length;i++) bin+=String.fromCharCode(b[i]);
    return btoa(bin);
  }
  function b64Decode(s){
    var bin=atob(s), b=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
    return new TextDecoder().decode(b);
  }
  function adoptRemote(remote){
    var base=defaultProgress();
    for(var k in remote){ base[k]=remote[k]; }
    base.tasks=(remote.tasks&&remote.tasks.length!==undefined)?remote.tasks:defaultTasks();
    base.tasks.forEach(function(t){ if(t.repeat===true) t.repeat="daily"; });
    state=base;
    normalizeHabits();
    persist(); render();
  }
  // 把 other 里 base 没有的任务/足迹/列表合并进 base（两边数据都不丢）
  function mergeInto(base, other){
    var bt = (base.tasks && base.tasks.length!==undefined) ? base.tasks : [];
    var ot = (other.tasks && other.tasks.length!==undefined) ? other.tasks : [];
    var byId={}, byName={};
    bt.forEach(function(t){ if(t && t.id) byId[t.id]=t; if(t && t.name) byName[t.name]=t; });
    ot.forEach(function(t){
      if(t && t.id && !byId[t.id] && !byName[t.name]){ byId[t.id]=t; byName[t.name]=t; }
    });
    base.tasks = Object.keys(byId).map(function(k){ return byId[k]; });
    base.tasks.forEach(function(t){ if(t.repeat===true) t.repeat="daily"; });

    var bh = base.history || [], oh = other.history || [];
    var seen={};
    bh.forEach(function(h){ seen[h.d+"|"+h.n]=1; });
    oh.forEach(function(h){ if(!seen[h.d+"|"+h.n]){ seen[h.d+"|"+h.n]=1; bh.push(h); } });
    base.history = bh;

    function unionArr(a,b){
      var s={};
      (a||[]).forEach(function(x){ s[x]=1; });
      (b||[]).forEach(function(x){ s[x]=1; });
      return Object.keys(s);
    }
    base.outDays = unionArr(base.outDays, other.outDays);
    base.unlocked = unionArr(base.unlocked, other.unlocked);

    function mergeObj(a,b){
      var out={};
      for(var k in (b||{})) out[k]=b[k];
      for(var k in (a||{})) out[k]=a[k];
      return out;
    }
    base.moods = mergeObj(base.moods, other.moods);
    base.energies = mergeObj(base.energies, other.energies);

    return base;
  }
  // 只合并「足迹」（打卡记录），永不删除任何一条；任务列表不合并（支持删除）
  function mergeHistory(base, other){
    var bh = (base && base.history) || [];
    var oh = (other && other.history) || [];
    var seen={};
    bh.forEach(function(h){ seen[h.d+"|"+h.n]=1; });
    oh.forEach(function(h){ if(!seen[h.d+"|"+h.n]){ seen[h.d+"|"+h.n]=1; bh.push(h); } });
    return bh;
  }
  // 只把本地「多出来的任务」并进云端；云端已有成长数值/足迹一律保留，绝不用旧设备数据覆盖
  function pushSeed(){
    if(!syncEnabled()) return;
    fetch(apiUrl(),{headers:getHeaders()})
      .then(function(r){ return r.status===404 ? null : (r.ok ? r.json() : Promise.reject(new Error("g "+r.status))); })
      .then(function(j){
        var base=null, sha=null;
        if(j){
          sha=j.sha;
          try{ base=JSON.parse(b64Decode(j.content.replace(/\s+/g,""))); }catch(e){}
        }
        if(!base) base=defaultProgress();
        var merged=mergeInto(base, state);   // 云端为底，本地独有任务并入，云端数值保留
        var content=b64Encode(JSON.stringify(merged));
        var body={message:"seed tasks", content:content};
        if(sha) body.sha=sha;
        return fetch(apiUrl(),{method:"PUT",headers:getHeaders(),body:JSON.stringify(body)});
      })
      .then(function(r){ if(r&&!r.ok) throw new Error("p "+r.status); lastSyncAt=Date.now(); setSyncStatus("已同步 "+fmtTime(lastSyncAt)); })
      .catch(function(){});
  }

  var pushTimer=null;
  var lastSyncAt=0;
  function fmtTime(ts){
    var d=new Date(ts);
    function p(n){return (n<10?"0":"")+n;}
    return p(d.getHours())+":"+p(d.getMinutes());
  }
  function schedulePush(){
    if(!syncEnabled()) return;
    clearTimeout(pushTimer);
    pushTimer=setTimeout(pushToCloud,1200);
  }
  function pushToCloud(){
    if(!syncEnabled()) return;
    if(!state._ts){ state._ts=Date.now(); persist(); }
    fetch(apiUrl(),{headers:getHeaders()})
      .then(function(r){ return r.status===404 ? null : (r.ok ? r.json() : Promise.reject(new Error("get "+r.status))); })
      .then(function(j){
        var sha=null;
        if(j){
          sha=j.sha;
          try{
            var remote=JSON.parse(b64Decode(j.content.replace(/\s+/g,"")));
            state.history = mergeHistory(state.history, remote.history);   // 只合并云端足迹，任务以本地为准（支持删除）
            persist();
          }catch(e){}
        }
        var content=b64Encode(JSON.stringify(state));
        var body={message:"sync "+dayKey(), content:content};
        if(sha) body.sha=sha;
        return fetch(apiUrl(),{method:"PUT",headers:getHeaders(),body:JSON.stringify(body)});
      })
      .then(function(r){ if(r&&!r.ok) throw new Error("put "+r.status); lastSyncAt=Date.now(); setSyncStatus("已同步 "+fmtTime(lastSyncAt)); })
      .catch(function(){ setSyncStatus("同步失败（稍后自动重试）"); });
  }
  function pullFromCloud(){
    if(!syncEnabled()) return;
    fetch(apiUrl(),{headers:getHeaders()})
      .then(function(r){ return r.status===404 ? null : (r.ok ? r.json() : Promise.reject(new Error("pull "+r.status))); })
      .then(function(j){
        if(!j){ pushToCloud(); return; }
        var remote=JSON.parse(b64Decode(j.content.replace(/\s+/g,"")));
        var rt=remote._ts||0, lt=state._ts||0;
        if(rt > lt){
          remote.history = mergeHistory(remote.history, state.history);   // 保留本地足迹，任务以云端为准
          adoptRemote(remote);
          lastSyncAt=Date.now();
          setSyncStatus("已从云端更新 "+fmtTime(lastSyncAt));
          toast("☁️ 已同步最新数据");
        }else if(lt > rt){
          pushToCloud();
        }else{
          lastSyncAt=Date.now();
          setSyncStatus("已同步 "+fmtTime(lastSyncAt));
        }
      })
      .catch(function(){ setSyncStatus("同步失败（网络？）"); });
  }
  function connectSync(token){
    token=(token||"").trim();
    if(!token){ setSyncStatus("令牌不能为空"); return; }
    localStorage.setItem(SYNC_TOKEN_KEY, token);
    closeSyncModal();
    setSyncStatus("连接中…");
    var first = !localStorage.getItem("grimoire_sync_onboarded");
    if(first){
      // 这台设备第一次连接：云端优先（避免覆盖另一台设备已有的数据）
      fetch(apiUrl(),{headers:getHeaders()})
        .then(function(r){ return r.status===404 ? null : (r.ok ? r.json() : Promise.reject(new Error("c "+r.status))); })
        .then(function(j){
          if(j){
            var remote=JSON.parse(b64Decode(j.content.replace(/\s+/g,"")));
            adoptRemote(remote);
            setSyncStatus("已从云端同步");
            toast("☁️ 已从云端同步数据");
          }else{
            pushToCloud();
          }
          localStorage.setItem("grimoire_sync_onboarded","1");
        })
        .catch(function(){ setSyncStatus("连接失败（检查令牌/网络）"); });
    }else{
      pullFromCloud();
    }
    toast("☁️ 已开启云端同步");
  }
  function disconnectSync(){
    localStorage.removeItem(SYNC_TOKEN_KEY);
    setSyncStatus("未开启同步");
    closeSyncModal();
  }
  function syncNow(){
    if(!syncEnabled()){ openSyncModal(); return; }
    setSyncStatus("同步中…");
    pullFromCloud();
  }
  function setSyncStatus(msg){
    var el=document.getElementById("syncStatus");
    if(el) el.textContent="☁️ "+msg;
  }
  function openSyncModal(){
    document.getElementById("syncToken").value="";
    document.getElementById("syncDisconnect").style.display = syncEnabled() ? "inline-block" : "none";
    document.getElementById("syncModal").style.display="flex";
    document.getElementById("syncToken").focus();
  }
  function closeSyncModal(){
    document.getElementById("syncModal").style.display="none";
  }

  // ---------- 事件 ----------
  document.addEventListener("click",function(e){
    var t=e.target;
    if(t.id==="addTask"){ addTask(); }
    else if(t.id==="restBtn"){ rest(); }
    else if(t.id==="exportBtn"){ exportData(); }
    else if(t.id==="importBtn"){ document.getElementById("importFile").click(); }
    else if(t.id==="resetBtn"){
      if(confirm("确定要重置全部数据吗？此操作不可撤销。建议先导出备份。")){
        localStorage.removeItem(PROGRESS_KEY);
        localStorage.removeItem(TASKS_KEY);
        for(var i=1;i<=6;i++){ localStorage.removeItem("grimoire_v"+i); }
        load(); render(); toast("已重置");
      }
    }
    else if(t.id==="backfillBtn"){ toggleBackfill(); }
    else if(t.id==="bfSave"){ saveBackfill(); }
    else if(t.id==="syncSetupBtn"){ openSyncModal(); }
    else if(t.id==="syncNowBtn"){ syncNow(); }
    else if(t.id==="syncSave"){ connectSync(document.getElementById("syncToken").value); }
    else if(t.id==="syncCancel"){ closeSyncModal(); }
    else if(t.id==="syncDisconnect"){ disconnectSync(); }
    else if(t.id==="syncModal"){ closeSyncModal(); }
    else if(t.id==="markPeriodBtn"){ markPeriod(); }
    else if(t.id==="outBtn"){ toggleOut(); }
    else if(t.hasAttribute("data-mood")){ setMood(parseInt(t.getAttribute("data-mood"),10)); }
    else if(t.hasAttribute("data-en")){ setEnergy(parseInt(t.getAttribute("data-en"),10)); }
    else if(t.hasAttribute("data-del")){ delTask(t.getAttribute("data-del")); }
    else if(t.hasAttribute("data-deadline")){ editDeadline(t.getAttribute("data-deadline")); }
  });

  document.addEventListener("change",function(e){
    var t=e.target;
    if(t.type==="checkbox" && t.hasAttribute("data-id")){ toggleTask(t.getAttribute("data-id")); }
    else if(t.type==="checkbox" && t.hasAttribute("data-quest")){
      toggleStep(t.getAttribute("data-quest"), t.getAttribute("data-step"));
    }
  });

  // 回车不再直接添加日课（避免中文输入法选字时误触回车，把没写完的日课加进去）；只点「＋」按钮添加
  document.getElementById("importFile").addEventListener("change",function(e){
    if(e.target.files && e.target.files[0]){ importData(e.target.files[0]); }
    e.target.value="";
  });
  document.getElementById("charName").addEventListener("click",function(){
    var v=prompt("给你的学徒起个名字：", state.name||"");
    if(v && v.trim()){ state.name=v.trim(); save(); render(); }
  });

  // ---------- 启动 ----------
  load(); render(); checkDayRollover();
  setSyncStatus(syncEnabled() ? "已连接" : "未开启同步");
  if(syncEnabled()) pullFromCloud();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  setInterval(function(){
    // 每 30s：检查是否跨天 + 刷新倒计时 + 云端同步（只在页面可见时）
    if(!document.hidden){ checkDayRollover(); renderQuests(); if(syncEnabled()) pullFromCloud(); }
  },30000);
  window.addEventListener("focus", function(){ checkDayRollover(); if(syncEnabled()) pullFromCloud(); });
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && syncEnabled()) pullFromCloud();
  });
})();
</script>
</body>
</html>
